<app-header></app-header>
<div class="register-page">
  <div class="hero-landing">
    <div class="white-shape"></div>
    <div class="hero-section">
      <div class="hero-content">
        <h1 class="hero-title">Nơi Khởi Nguồn Niềm Tin</h1>
        <p class="hero-description">
          Chúng tôi am hiểu những thách thức lớn trong y học và mang đến sự chăm sóc tận tâm cho từng bệnh nhân.
        </p>
        <div class="hero-buttons">
          <a class="btn-primary" routerLink="/register">Đặt lịch ngay</a>
          <button class="btn-secondary">Tìm hiểu thêm</button>
        </div>
      </div>
      <div class="ambulance-image">
        <div class="ambulance-placeholder">🚑</div>
      </div>
    </div>
  </div>
  
  <div class="register-form-overlay">
    <div class="register-form-container">
      <h2 class="register-title">REGISTER <span>🌻</span></h2>
      
      <form class="register-form">
        <div class="form-group">
          <div class="input-wrapper">
            <span class="input-icon">👤</span>
            <input 
              type="text" 
              class="form-control" 
              id="hoTen" 
              placeholder="Họ và tên (tùy chọn)"
              [(ngModel)]="HoTen" 
              name="HoTen"
            />
          </div>
        </div>

        <div class="form-group">
          <div class="input-wrapper">
            <span class="input-icon">✉️</span>
            <input 
              type="email" 
              class="form-control" 
              id="tenDangNhap" 
              placeholder="Email (Tên đăng nhập) *"
              [(ngModel)]="TenDangNhap" 
              name="TenDangNhap"
            />
          </div>
        </div>

        <div class="form-group">
          <div class="input-wrapper">
            <span class="input-icon">📞</span>
            <input 
              type="tel" 
              class="form-control" 
              id="soDienThoai" 
              placeholder="Số điện thoại"
              [(ngModel)]="SoDienThoai" 
              name="SoDienThoai"
            />
          </div>
        </div>

        <div class="form-group">
          <div class="input-wrapper">
            <span class="input-icon">🆔</span>
            <input 
              type="text" 
              class="form-control" 
              id="cmnd" 
              placeholder="CMND/CCCD"
              [(ngModel)]="CMND_CCCD" 
              name="CMND_CCCD"
            />
          </div>
        </div>

        <div class="form-group">
          <div class="input-wrapper">
            <span class="input-icon">📍</span>
            <input 
              type="text" 
              class="form-control" 
              id="diaChi" 
              placeholder="Địa chỉ"
              [(ngModel)]="DiaChi" 
              name="DiaChi"
            />
          </div>
        </div>

        <div class="form-group password-field">
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input
              type="password"
              placeholder="Mật khẩu *"
              class="form-control"
              id="password"
              [(ngModel)]="MatKhau"
              name="MatKhau"
            />
            <i class="password-toggle fas fa-eye-slash" (click)="togglePasswordVisibility('password')"></i>
          </div>
        </div>

        <div class="form-group password-field">
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input
              type="password"
              placeholder="Nhập lại mật khẩu *"
              class="form-control"
              id="confirmPassword"
              [(ngModel)]="confirmPassword"
              name="confirmPassword"
            />
            <i class="password-toggle fas fa-eye-slash" (click)="togglePasswordVisibility('confirmPassword')"></i>
          </div>
        </div>


        <button type="button" class="register-button" (click)="onRegister()">REGISTER</button>
      </form>
    </div>
  </div>
</div>
