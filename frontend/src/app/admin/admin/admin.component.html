<div class="admin-layout">
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <div class="logo-icon">🏥</div>
        <div class="logo-text">
          <div class="logo-title">Hệ thống</div>
          <div class="logo-subtitle">Quản lý khám bệnh</div>
        </div>
      </div>
    </div>
    <div class="menu-items">
      <a [routerLink]="['users']" routerLinkActive="active" class="menu-item">
        <i class="menu-icon">👥</i>
        <span>Quản lý Tài khoản</span>
      </a>
      <a [routerLink]="['doctor-management']" routerLinkActive="active" class="menu-item">
        <i class="menu-icon">👨‍⚕️</i>
        <span>Quản lý bác sĩ</span>
      </a>
      <a [routerLink]="['patient-management']" routerLinkActive="active" class="menu-item">
        <i class="menu-icon">👤</i>
        <span>Quản lý bệnh nhân</span>
      </a>
      <a [routerLink]="['appointment-management']" routerLinkActive="active" class="menu-item">
        <i class="menu-icon">📋</i>
        <span>Quản lý lịch hẹn</span>
      </a>
      <a [routerLink]="['schedule-management']" routerLinkActive="active" class="menu-item">
        <i class="menu-icon">📅</i>
        <span>Quản lý lịch làm việc</span>
      </a>
      <div class="menu-divider"></div>
      <div class="menu-item logout-item" (click)="onLogout()">
        <i class="menu-icon">🚪</i>
        <span>Đăng xuất</span>
      </div>
    </div>
  </div>
  <div class="admin-content">
    <router-outlet></router-outlet>
  </div>
</div>
