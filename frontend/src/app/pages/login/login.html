<div class="login-container">
    <div class="background-image">
        <img src="assets/images/hopital.jpg" alt="Hospital Background">
    </div>
    <!-- Background content -->
    <div class="background-content" style="margin-left: 20pc;">
        <h1>Nơi Khởi Nguồn<br>Niềm Tin</h1>
        <p>Chúng tôi am hiểu những thách thức lớn trong y học<br>và mang đến sự chăm sóc tận tâm cho từng bệnh nhân.</p>
        <div class="action-buttons">
            <button class="primary-btn">Đặt lịch ngay</button>
            <button class="secondary-btn">Tìm hiểu thêm</button>
        </div>
    </div>

    <!-- Login form overlay -->
    <div class="login-form-container">
        <div class="login-form">
            <h2>WELCOME BACK <span class="emoji">🌻</span></h2>
            <form>
                <div class="form-group input-icon">
                    <i class="fa fa-envelope"></i>
                    <input type="email" placeholder="Email" required>
                </div>

                <div class="form-group input-icon">
                    <i class="fa fa-lock"></i>
                    <div class="password-input">
                        <input type="password" placeholder="Password" required>
                        <button type="button" class="toggle-password" aria-label="Toggle password">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="forgot-password">
                    <a href="#">Forgot Your Password?</a>
                </div>

                <button type="submit" class="login-btn">LOGIN</button>
            </form>
        </div>
    </div>
</div>
