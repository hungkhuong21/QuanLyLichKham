<app-header></app-header>
<div class="forgot-password-page">
  <div class="hero-landing">
    <div class="white-shape"></div>
    <div class="hero-section">
      <div class="hero-content">
        <h1 class="hero-title">Nơi Khởi Nguồn Niềm Tin</h1>
        <p class="hero-description">
          Chúng tôi am hiểu những thách thức lớn trong y học và mang đến sự chăm sóc tận tâm cho từng bệnh nhân.
        </p>
        <div class="hero-buttons">
          <a class="btn-primary" routerLink="/register">Đặt lịch ngay</a>
          <button class="btn-secondary">Tìm hiểu thêm</button>
        </div>
      </div>
      <div class="ambulance-image">
        <div class="ambulance-placeholder">🚑</div>
      </div>
    </div>
  </div>
  
  <div class="forgot-password-form-overlay">
    <div class="forgot-password-form-container">
      <h2 class="form-title">Forgot password</h2>
      <p class="form-description">
        Enter your email for the verification proccess, we will send 4 digits code to your email.
      </p>
      
      <form class="forgot-password-form" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="email" class="form-label">E mail</label>
          <div class="input-wrapper">
            <span class="input-icon">✉️</span>
            <input 
              type="text" 
              class="form-control" 
              id="tenDangNhap" 
              placeholder="Tên đăng nhập (Email)"
              [(ngModel)]="TenDangNhap" 
              name="TenDangNhap"
              required 
            />
          </div>
        </div>

        <button type="submit" class="continue-button">CONTINUE</button>
      </form>
    </div>
  </div>
</div>
