<app-header></app-header>
<div class="verify-code-page">
  <div class="hero-landing">
    <div class="white-shape"></div>
    <div class="hero-section">
      <div class="hero-content">
        <h1 class="hero-title">Nơi Khởi Nguồn Niềm Tin</h1>
        <p class="hero-description">
          Chúng tôi am hiểu những thách thức lớn trong y học và mang đến sự chăm sóc tận tâm cho từng bệnh nhân.
        </p>
        <div class="hero-buttons">
          <a class="btn-primary" routerLink="/register">Đặt lịch ngay</a>
          <button class="btn-secondary">Tìm hiểu thêm</button>
        </div>
      </div>
      <div class="ambulance-image">
        <div class="ambulance-placeholder">🚑</div>
      </div>
    </div>
  </div>
  
  <div class="verify-code-form-overlay">
    <div class="verify-code-form-container">
      <h2 class="form-title">Verification</h2>
      <p class="form-description">
        Enter your 4 digits code that you received on your email.
      </p>
      
      <form class="verify-code-form" (ngSubmit)="onSubmit()">
        <div class="code-inputs">
          <input
            *ngFor="let digit of code; let i = index"
            type="text"
            class="code-input"
            [id]="'code-' + i"
            maxlength="1"
            [value]="code[i]"
            [name]="'code-' + i"
            (input)="onCodeInput($event, i)"
            (keydown)="onCodeKeyDown($event, i)"
            (paste)="onPaste($event)"
            pattern="[0-9]"
            inputmode="numeric"
            required
          />
        </div>

        <div class="timer" [class.timer-warning]="timeLeft <= 10">
          {{ formattedTime }}
        </div>

        <button 
          type="submit" 
          class="verify-button"
          [disabled]="!isCodeComplete"
        >
          {{ isCodeComplete ? 'VERIFY' : 'CONTINUE' }}
        </button>

        <div class="resend-section">
          <span class="resend-text">If you didn't receive a code?</span>
          <a 
            href="#" 
            class="resend-link"
            [class.disabled]="!canResend"
            (click)="onResend(); $event.preventDefault()"
          >
            Resend
          </a>
        </div>
      </form>
    </div>
  </div>
</div>
