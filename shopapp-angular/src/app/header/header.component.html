<header class="healthcare-header">
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <!-- Logo -->
      <a class="navbar-brand" routerLink="/" (click)="scrollToTop()">
        <span class="logo-icon">🌿</span>
        <span class="logo-text">Healthcare</span>
      </a>

      <!-- Toggle cho mobile -->
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarNav"
        aria-controls="navbarNav"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Navbar nội dung -->
      <div class="collapse navbar-collapse" id="navbarNav">
        <!-- Bên phải: Navigation Links -->
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a
              class="nav-link"
              routerLink="/"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }"
              (click)="scrollToTop()"
            >
              Trang Chủ
            </a>
          </li>
          <li class="nav-item">
            <a
              class="nav-link"
              href="#services"
              routerLinkActive="active"
            >
              Dịch Vụ
            </a>
          </li>
          <li class="nav-item">
            <a
              class="nav-link"
              href="#contact"
              routerLinkActive="active"
            >
              Liên Hệ
            </a>
          </li>
          <li class="nav-item" *ngIf="!isLoggedIn">
            <a
              class="nav-link"
              routerLink="/register"
              routerLinkActive="active"
            >
              Đăng Ký
            </a>
          </li>
          <li class="nav-item">
            <ng-container *ngIf="isLoggedIn; else showLogin">
              <a
                class="nav-link login-btn"
                (click)="onLogout()"
                style="cursor: pointer;"
              >
                Đăng Xuất
              </a>
            </ng-container>
            <ng-template #showLogin>
              <a
                class="nav-link login-btn"
                routerLink="/login"
                routerLinkActive="active"
              >
                Đăng Nhập
              </a>
            </ng-template>
          </li>
        </ul>
      </div>
    </div>
  </nav>
</header>
